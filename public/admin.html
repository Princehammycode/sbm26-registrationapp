<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - HHC-SBM</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="dashboard-container">
    <header class="dashboard-header">
      <div class="header-content">
        <h1>HHC-SBM Admin Dashboard</h1>
        <div class="header-actions">
          <button onclick="refreshData()" class="refresh-btn">
            <span class="refresh-icon">↻</span> Refresh
          </button>
          <button onclick="logout()" class="logout-btn">
            🚪 Logout
          </button>
        </div>
      </div>
    </header>

    <main class="dashboard-main">
      <!-- Statistics Cards -->
      <section class="stats-section">
        <div class="stat-card">
          <div class="stat-icon" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
            <span>👥</span>
          </div>
          <div class="stat-content">
            <h3>Total Registrations</h3>
            <p class="stat-number" id="totalRegistrations">0</p>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-icon" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
            <span>📧</span>
          </div>
          <div class="stat-content">
            <h3>Emails Sent</h3>
            <p class="stat-number" id="emailsSent">0</p>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-icon" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">
            <span>📱</span>
          </div>
          <div class="stat-content">
            <h3>SMS Sent</h3>
            <p class="stat-number" id="smsSent">0</p>
          </div>
        </div>
      </section>

      <!-- Search and Filter -->
      <section class="controls-section">
        <div class="search-box">
          <input 
            type="text" 
            id="searchInput" 
            placeholder="Search by name, contact, email..."
            onkeyup="filterTable()"
          >
        </div>
        <button onclick="exportToExcel()" class="export-btn">
          📊 Export to Excel
        </button>
      </section>

      <!-- Registrations Table -->
      <section class="table-section">
        <div class="table-container">
          <table id="registrationsTable">
            <thead>
              <tr>
                <th>#</th>
                <th>Ticket ID</th>
                <th>Name</th>
                <th>Contact</th>
                <th>Email</th>
                <th>Location</th>
                <th>Registered At</th>
                <th>Email Sent</th>
                <th>SMS Sent</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <tr>
                <td colspan="9" class="loading">Loading registrations...</td>
              </tr>
            </tbody>
          </table>
        </div>
        
        <!-- Pagination Controls -->
        <div class="pagination-container">
          <div class="pagination-info">
            <span id="paginationInfo">Showing 0 - 0 of 0 entries</span>
          </div>
          <div class="pagination-controls">
            <button onclick="goToFirstPage()" id="firstPageBtn" class="pagination-btn" disabled>⟪ First</button>
            <button onclick="previousPage()" id="prevPageBtn" class="pagination-btn" disabled>‹ Previous</button>
            <span id="pageNumbers" class="page-numbers"></span>
            <button onclick="nextPage()" id="nextPageBtn" class="pagination-btn" disabled>Next ›</button>
            <button onclick="goToLastPage()" id="lastPageBtn" class="pagination-btn" disabled>Last ⟫</button>
          </div>
        </div>
      </section>
    </main>

    <footer class="dashboard-footer">
      <p>HHC-SBM Registration System &copy; 2025</p>
    </footer>
  </div>

  <script src="js/config.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Check authentication after scripts load
    if (!checkAuth()) {
      // Will redirect to login if not authenticated
    }
  </script>
</body>
</html>
