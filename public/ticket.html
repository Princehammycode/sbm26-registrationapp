<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download Ticket - HHC-SBM</title>
  <link rel="stylesheet" href="css/ticket.css">
</head>
<body>
  <div class="container">
    <div class="ticket-card" id="ticketCard">
      <div class="ticket-header">
        <h1>HHC-SBM</h1>
        <h2>Event Ticket</h2>
      </div>

      <div id="ticketContent" class="ticket-content">
        <div class="loading">
          <div class="spinner"></div>
          <p>Loading your ticket...</p>
        </div>
      </div>
    </div>

    <div class="actions" id="actions" style="display: none;">
      <button onclick="downloadTicket()" class="action-btn primary">
        📥 Download Ticket
      </button>
      <button onclick="window.print()" class="action-btn secondary">
        🖨️ Print Ticket
      </button>
    </div>

    <div class="footer">
      <p>HHC-SBM Event Registration System</p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/ticket.js"></script>
</body>
</html>
